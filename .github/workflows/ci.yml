name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and pytest
        run: python -m pip install -e ".[dev]"
      - name: Run pytest suite
        run: pytest -v
      - name: Verify clean comparison exits 0
        run: agent-eval-ci --baseline fixtures/baseline_traces.json --candidate fixtures/candidate_clean_traces.json
      - name: Verify regression demo exits 1
        run: |
          set +e
          agent-eval-ci --baseline fixtures/baseline_traces.json --candidate fixtures/candidate_traces.json
          status=$?
          set -e
          test "$status" -eq 1
